[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2score"
version = "0.7.0"
description = "Audio-to-sheet-music pipeline with audio-validated piano transcription and adaptive score quantization."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Audio2Score prototype"}]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.18,<2",
  "librosa>=1.0,<2",
  "soundfile>=0.14,<1",
  "pretty_midi>=0.2.10,<1",
]

[project.optional-dependencies]
separation = [
  "audio-separator[cpu]>=0.47.0"
]
piano-neural = [
  "transkun==2.0.1",
  "audioop-lts>=0.2.2; python_version >= '3.13'"
]
full = [
  "audio-separator[cpu]>=0.47.0",
  "transkun==2.0.1",
  "audioop-lts>=0.2.2; python_version >= '3.13'"
]
dev = ["pytest>=8,<10"]

[project.scripts]
audio2score = "audio2score.cli:main"
audio2score-doctor = "audio2score.doctor:main"
audio2score-compare = "audio2score.compare:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
